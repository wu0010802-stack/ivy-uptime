name: staging-uptime

# staging 測試機監控（每 30 分鐘）。開發期間 staging 常態性紅燈時，
# 可一鍵停用：repo → Actions → staging-uptime → Disable workflow
on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: staging 後端 /api/health/ready（經前端同源代理；含 DB 連線）
        run: |
          # 2026-10-19：Zeabur 已刪（2026-08-30），改打 Railway staging 的義華租戶網域。
          curl -fsS -m 20 --retry 3 --retry-delay 10 --retry-all-errors \
            https://yihua.staging.ivypreschool.tw/api/health/ready
